[versions]
androidlog = "2.0.60"
agp = "9.4.0"
activity = "1.13.0"
composeBom = "2026.08.00"
coreKtx = "1.19.0"
datastore = "1.2.1"
junit = "4.13.2"
kotlin = "2.4.10"
kotlinxCoroutinesTest = "1.11.0"
kotlinxSerialization = "1.11.0"
lifecycle = "2.11.0"
robolectric = "4.16.1"
roborazzi = "1.73.0"
